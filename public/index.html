<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Temp Mail</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a0a;
    --surface: #141414;
    --surface-2: #1c1c1c;
    --border: #262626;
    --border-hover: #404040;
    --text: #ededed;
    --text-dim: #888;
    --text-muted: #555;
    --accent: #ffffff;
    --accent-hover: #d4d4d4;
    --danger: #ef4444;
    --success: #22c55e;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .header {
    border-bottom: 1px solid var(--border);
    padding: 20px 32px;
    position: sticky;
    top: 0;
    background: rgba(10,10,10,0.8);
    backdrop-filter: blur(12px);
    z-index: 100;
  }
  .header-inner {
    max-width: 1200px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
  }
  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: -0.3px;
  }
  .logo-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--success);
    box-shadow: 0 0 12px var(--success);
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }
  .header-meta {
    font-size: 12px;
    color: var(--text-dim);
    font-family: 'SF Mono', 'Monaco', 'Courier New', monospace;
  }

  .container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 32px;
    display: grid;
    grid-template-columns: 380px 1fr;
    gap: 32px;
    align-items: start;
  }
  @media (max-width: 900px) {
    .container { grid-template-columns: 1fr; padding: 20px; gap: 20px; }
    .header { padding: 16px 20px; }
  }

  .sidebar {
    position: sticky;
    top: 100px;
  }
  @media (max-width: 900px) {
    .sidebar { position: static; }
  }

  .section-label {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-muted);
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .section-count {
    color: var(--text-dim);
    font-family: 'SF Mono', 'Monaco', monospace;
    font-weight: 500;
  }

  .input-wrap { display: flex; gap: 8px; margin-bottom: 20px; }
  .input-wrap input {
    flex: 1;
    padding: 10px 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 13px;
    font-family: 'SF Mono', 'Monaco', monospace;
    outline: none;
    transition: border-color 0.15s;
  }
  .input-wrap input:focus { border-color: var(--border-hover); }
  .input-wrap input::placeholder { color: var(--text-muted); }

  .btn {
    padding: 10px 16px;
    background: var(--accent);
    color: var(--bg);
    border: none;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    white-space: nowrap;
    font-family: inherit;
  }
  .btn:hover { background: var(--accent-hover); }
  .btn:active { transform: scale(0.97); }

  .btn-icon {
    padding: 8px;
    width: 34px;
    height: 34px;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-dim);
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.15s;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
  }
  .btn-icon:hover {
    color: var(--text);
    border-color: var(--border-hover);
    background: var(--surface-2);
  }
  .btn-icon.danger:hover {
    color: var(--danger);
    border-color: var(--danger);
  }

  .email-list { display: flex; flex-direction: column; gap: 8px; }

  .email-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    display: flex;
    align-items: center;
    gap: 12px;
    transition: all 0.15s;
    cursor: pointer;
  }
  .email-item:hover {
    border-color: var(--border-hover);
    background: var(--surface-2);
  }
  .email-item.active {
    border-color: var(--accent);
    background: var(--surface-2);
  }

  .email-item-body { flex: 1; min-width: 0; }
  .email-item-address {
    font-family: 'SF Mono', 'Monaco', monospace;
    font-size: 12px;
    color: var(--text);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    margin-bottom: 3px;
  }
  .email-item-meta {
    font-size: 11px;
    color: var(--text-muted);
    font-family: 'SF Mono', 'Monaco', monospace;
  }

  .email-item-actions {
    display: flex;
    gap: 4px;
    opacity: 0.4;
    transition: opacity 0.15s;
  }
  .email-item:hover .email-item-actions,
  .email-item.active .email-item-actions { opacity: 1; }

  .inbox {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    min-height: 500px;
  }

  .inbox-header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    background: var(--surface-2);
  }

  .inbox-title-wrap {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
    flex: 1;
  }
  .inbox-title {
    font-family: 'SF Mono', 'Monaco', monospace;
    font-size: 13px;
    color: var(--text);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .inbox-status {
    font-size: 11px;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: 'SF Mono', 'Monaco', monospace;
  }
  .inbox-status::before {
    content: "";
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--success);
  }

  .inbox-actions { display: flex; gap: 6px; }

  .messages {
    padding: 8px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    max-height: 700px;
    overflow-y: auto;
  }

  .message {
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--surface-2);
    transition: border-color 0.15s;
    overflow: hidden;
  }
  .message:hover { border-color: var(--border-hover); }

  .message-head {
    padding: 14px 16px;
    cursor: pointer;
    user-select: none;
  }

  .message-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 4px;
  }
  .message-from {
    font-family: 'SF Mono', 'Monaco', monospace;
    font-size: 12px;
    color: var(--text);
    font-weight: 500;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    flex: 1;
  }
  .message-time {
    font-family: 'SF Mono', 'Monaco', monospace;
    font-size: 11px;
    color: var(--text-muted);
    flex-shrink: 0;
  }
  .message-subject {
    font-size: 13px;
    color: var(--text);
    margin-bottom: 4px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .message-preview {
    font-size: 12px;
    color: var(--text-dim);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .message-body {
    border-top: 1px solid var(--border);
    background: #ffffff;
    display: none;
    padding: 0;
  }
  .message-body.open { display: block; }

  .message-body-content {
    padding: 24px;
    font-size: 14px;
    line-height: 1.65;
    color: #1a1a1a;
    word-break: break-word;
  }
  .message-body-content a {
    color: #2563eb;
    word-break: break-all;
  }
  .message-body-content img {
    max-width: 100%;
    height: auto;
    border-radius: 8px;
  }
  .message-body-content pre,
  .message-body-content code {
    background: #f5f5f5;
    padding: 2px 6px;
    border-radius: 4px;
    font-family: 'SF Mono', 'Monaco', 'Courier New', monospace;
    font-size: 13px;
    word-break: break-all;
    white-space: pre-wrap;
  }
  .message-body-content pre {
    padding: 12px 16px;
    overflow-x: auto;
  }

  .otp-highlight {
    background: #dcfce7;
    color: #166534;
    padding: 6px 12px;
    border-radius: 6px;
    font-weight: 700;
    font-family: 'SF Mono', 'Monaco', monospace;
    font-size: 18px;
    display: inline-block;
    margin: 8px 0;
    border: 1px solid #86efac;
    letter-spacing: 2px;
  }

  .msg-loading {
    padding: 20px;
    color: var(--text-dim);
    font-size: 12px;
    font-family: 'SF Mono', 'Monaco', monospace;
    text-align: center;
    background: var(--surface-2);
  }

  .empty {
    padding: 60px 20px;
    text-align: center;
    color: var(--text-muted);
    font-size: 13px;
  }
  .empty-icon {
    font-size: 32px;
    margin-bottom: 12px;
    opacity: 0.3;
  }

  .inbox-empty {
    padding: 100px 20px;
    text-align: center;
    color: var(--text-muted);
  }
  .inbox-empty-icon {
    font-size: 48px;
    opacity: 0.15;
    margin-bottom: 16px;
  }
  .inbox-empty-text { font-size: 14px; }

  .toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: var(--surface-2);
    border: 1px solid var(--border-hover);
    color: var(--text);
    padding: 12px 18px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 500;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    opacity: 0;
    transform: translateY(12px);
    transition: all 0.2s;
    pointer-events: none;
    z-index: 1000;
    max-width: 400px;
  }
  .toast.show { opacity: 1; transform: translateY(0); }
  .toast.error { border-color: var(--danger); color: var(--danger); }
  .toast.success { border-color: var(--success); }

  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--border-hover); }
</style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <div class="logo">
      <div class="logo-dot"></div>
      Temp Mail
    </div>
    <div class="header-meta" id="headerStatus">connecting...</div>
  </div>
</header>

<div class="container">

  <aside class="sidebar">
    <div class="input-wrap">
      <input type="text" id="emailInput" placeholder="nama-email" maxlength="30" autocomplete="off">
      <button class="btn" onclick="addEmail()">Tambah</button>
    </div>

    <div class="section-label">
      <span>Inbox Saya</span>
      <span class="section-count" id="emailCount">0</span>
    </div>

    <div class="email-list" id="emailList">
      <div class="empty">
        <div class="empty-icon">📭</div>
        Belum ada email
      </div>
    </div>
  </aside>

  <main>
    <div class="inbox" id="inboxPanel">
      <div class="inbox-header" id="inboxHeader" style="display:none;">
        <div class="inbox-title-wrap">
          <div class="inbox-title" id="inboxTitle">—</div>
        </div>
        <div class="inbox-actions">
          <button class="btn-icon" onclick="copyEmail()" title="Copy">📋</button>
          <button class="btn-icon" onclick="manualRefresh()" title="Refresh">🔄</button>
        </div>
      </div>
      <div class="inbox-status" id="inboxStatus" style="display:none;padding:0 20px 12px;"></div>

      <div class="messages" id="messages">
        <div class="inbox-empty">
          <div class="inbox-empty-icon">📬</div>
          <div class="inbox-empty-text">Pilih email untuk lihat pesan</div>
        </div>
      </div>
    </div>
  </main>

</div>

<div class="toast" id="toast"></div>

<script>
// ==============================================================================
// CONFIG
// ==============================================================================
var STORAGE_KEY = 'tempmail_emails';
var DOMAIN = 'akunlama.com';

// Proxy lewat server sendiri — biar CORS ilang
var API_LIST = function(email) {
  return '/api/list?recipient=' + encodeURIComponent(email);
};
var API_HTML = function(region, key) {
  return '/api/html?region=' + encodeURIComponent(region) + '&key=' + encodeURIComponent(key);
};

// ==============================================================================
// STATE
// ==============================================================================
var emails = [];
var activeEmail = null;
var refreshInterval = null;
var lastMessageIds = {};
var currentMessages = [];

// ==============================================================================
// STORAGE
// ==============================================================================
function loadFromStorage() {
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    emails = raw ? JSON.parse(raw) : [];
    if (!Array.isArray(emails)) emails = [];
  } catch(e) { emails = []; }
}

function saveToStorage() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(emails)); } catch(e) {}
}

// ==============================================================================
// TOAST
// ==============================================================================
function showToast(msg, type) {
  var toast = document.getElementById('toast');
  if (!toast) return;
  toast.textContent = msg;
  toast.className = 'toast show' + (type ? ' ' + type : '');
  clearTimeout(toast._t);
  toast._t = setTimeout(function() {
    toast.className = 'toast' + (type ? ' ' + type : '');
  }, 2500);
}

// ==============================================================================
// VALIDASI
// ==============================================================================
function isValidName(name) {
  if (!name || name.length < 2 || name.length > 30) return false;
  return /^[a-zA-Z0-9._-]+$/.test(name);
}

// ==============================================================================
// TAMBAH EMAIL
// ==============================================================================
function addEmail() {
  var input = document.getElementById('emailInput');
  if (!input) return;

  var name = input.value.trim().toLowerCase();

  if (!isValidName(name)) {
    showToast('Nama harus 2-30 karakter', 'error');
    return;
  }

  if (emails.find(function(e) { return e.name === name; })) {
    showToast('Email sudah ada', 'error');
    return;
  }

  emails.push({ name: name, createdAt: Date.now(), lastCheck: null });
  saveToStorage();
  input.value = '';

  renderEmailList();
  showToast(name + '@' + DOMAIN + ' ditambahkan', 'success');
}

// ==============================================================================
// HAPUS EMAIL
// ==============================================================================
function deleteEmail(name, ev) {
  if (ev) ev.stopPropagation();
  if (!confirm('Hapus ' + name + '@' + DOMAIN + '?')) return;

  emails = emails.filter(function(e) { return e.name !== name; });
  saveToStorage();

  if (activeEmail === name) {
    activeEmail = null;
    stopAutoRefresh();
    document.getElementById('inboxHeader').style.display = 'none';
    document.getElementById('inboxStatus').style.display = 'none';
    document.getElementById('messages').innerHTML =
      '<div class="inbox-empty"><div class="inbox-empty-icon">📬</div><div class="inbox-empty-text">Pilih email untuk lihat pesan</div></div>';
  }

  renderEmailList();
  showToast('Email dihapus');
}

// ==============================================================================
// BUKA INBOX
// ==============================================================================
function openInbox(name) {
  activeEmail = name;
  document.getElementById('inboxHeader').style.display = 'flex';
  document.getElementById('inboxStatus').style.display = 'flex';
  document.getElementById('inboxTitle').textContent = name + '@' + DOMAIN;

  renderEmailList();
  lastMessageIds = {};
  currentMessages = [];
  fetchInbox();
  startAutoRefresh();
}

// ==============================================================================
// AUTO REFRESH
// ==============================================================================
function startAutoRefresh() {
  stopAutoRefresh();
  refreshInterval = setInterval(fetchInbox, 5000);
}

function stopAutoRefresh() {
  if (refreshInterval) {
    clearInterval(refreshInterval);
    refreshInterval = null;
  }
}

function manualRefresh() {
  if (!activeEmail) return;
  fetchInbox();
  showToast('Refreshing...');
}

// ==============================================================================
// FETCH INBOX
// ==============================================================================
function fetchInbox() {
  if (!activeEmail) return;

  var fullEmail = activeEmail + '@' + DOMAIN;
  var url = API_LIST(fullEmail);

  fetch(url)
    .then(function(r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(function(data) {
      if (!Array.isArray(data)) data = [];

      var parsed = data.map(function(m, idx) {
        var headers = (m.message && m.message.headers) || {};
        var ts = m.timestamp ? new Date(m.timestamp * 1000) : null;

        return {
          id: (m.storage && m.storage.key) ? m.storage.key : ('msg-' + idx),
          from: headers.from || 'Unknown',
          subject: headers.subject || '(no subject)',
          time: ts ? ts.toLocaleString('id-ID', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' }) : '',
          preview: m.preview || '',
          storageKey: (m.storage && m.storage.key) ? m.storage.key : null,
          region: (m.storage && m.storage.region) ? m.storage.region : 'us',
          loaded: false,
          body: ''
        };
      });

      var emailData = emails.find(function(e) { return e.name === activeEmail; });
      if (emailData) {
        emailData.lastCheck = Date.now();
        saveToStorage();
      }

      if (Object.keys(lastMessageIds).length > 0) {
        var newCount = parsed.filter(function(m) { return !lastMessageIds[m.id]; }).length;
        if (newCount > 0) {
          showToast(newCount + ' pesan baru', 'success');
        }
      }

      parsed.forEach(function(m) { lastMessageIds[m.id] = true; });

      parsed.forEach(function(newMsg) {
        var old = currentMessages.find(function(m) { return m.id === newMsg.id; });
        if (old && old.loaded) {
          newMsg.loaded = true;
          newMsg.body = old.body;
        }
      });

      renderMessages(parsed);
      updateStatusTime();
    })
    .catch(function(err) {
      console.error('Fetch error:', err);
      document.getElementById('messages').innerHTML =
        '<div class="inbox-empty"><div class="inbox-empty-icon">⚠️</div><div class="inbox-empty-text">Gagal memuat: ' + escapeHtml(err.message) + '</div></div>';
    });
}

// ==============================================================================
// RENDER EMAIL LIST
// ==============================================================================
function renderEmailList() {
  var list = document.getElementById('emailList');
  var countEl = document.getElementById('emailCount');
  if (!list) return;

  if (countEl) countEl.textContent = emails.length;

  if (emails.length === 0) {
    list.innerHTML = '<div class="empty"><div class="empty-icon">📭</div>Belum ada email</div>';
    return;
  }

  var html = '';
  emails.forEach(function(e) {
    var active = e.name === activeEmail ? ' active' : '';
    html += '<div class="email-item' + active + '" onclick="openInbox(\'' + e.name + '\')">';
    html += '<div class="email-item-body">';
    html += '<div class="email-item-address">' + escapeHtml(e.name) + '@' + DOMAIN + '</div>';
    html += '<div class="email-item-meta">';
    if (e.lastCheck) {
      html += 'Cek: ' + new Date(e.lastCheck).toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
    } else {
      html += 'Belum dicek';
    }
    html += '</div></div>';
    html += '<div class="email-item-actions">';
    html += '<button class="btn-icon danger" onclick="deleteEmail(\'' + e.name + '\', event)" title="Hapus">✕</button>';
    html += '</div>';
    html += '</div>';
  });

  list.innerHTML = html;
}

// ==============================================================================
// RENDER MESSAGES
// ==============================================================================
function renderMessages(messages) {
  currentMessages = messages;
  var container = document.getElementById('messages');
  if (!container) return;

  if (messages.length === 0) {
    container.innerHTML = '<div class="inbox-empty"><div class="inbox-empty-icon">📭</div><div class="inbox-empty-text">Belum ada pesan</div></div>';
    return;
  }

  var html = '';
  messages.forEach(function(m, i) {
    var isOpen = m.loaded && m.body;
    html += '<div class="message">';
    html += '<div class="message-head" onclick="toggleMessage(' + i + ')">';
    html += '<div class="message-row">';
    html += '<div class="message-from">' + escapeHtml(m.from) + '</div>';
    html += '<div class="message-time">' + escapeHtml(m.time) + '</div>';
    html += '</div>';
    html += '<div class="message-subject">' + escapeHtml(m.subject) + '</div>';
    html += '<div class="message-preview">' + escapeHtml(m.preview.substring(0, 150)) + '</div>';
    html += '</div>';
    html += '<div class="message-body' + (isOpen ? ' open' : '') + '" id="body-' + i + '">';
    if (isOpen) {
      html += '<div class="message-body-content">' + m.body + '</div>';
    }
    html += '</div>';
    html += '</div>';
  });
  container.innerHTML = html;
}

// ==============================================================================
// TOGGLE MESSAGE
// ==============================================================================
function toggleMessage(i) {
  var body = document.getElementById('body-' + i);
  var msg = currentMessages[i];
  if (!body || !msg) return;

  if (body.classList.contains('open')) {
    body.classList.remove('open');
    return;
  }

  body.classList.add('open');

  if (!msg.loaded && msg.storageKey) {
    body.innerHTML = '<div class="msg-loading">Memuat pesan...</div>';
    loadMessageBody(i, msg);
  }
}

// ==============================================================================
// LOAD MESSAGE BODY
// ==============================================================================
function loadMessageBody(i, msg) {
  var body = document.getElementById('body-' + i);
  if (!body) return;

  var url = API_HTML(msg.region, msg.storageKey);

  fetch(url)
    .then(function(r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.text();
    })
    .then(function(html) {
      msg.body = html;
      msg.loaded = true;
      body.innerHTML = '<div class="message-body-content">' + html + '</div>';
    })
    .catch(function(err) {
      console.error('Load body error:', err);
      body.innerHTML = '<div class="msg-loading" style="color:var(--danger);">Gagal memuat: ' + escapeHtml(err.message) + '</div>';
    });
}

// ==============================================================================
// UTILS
// ==============================================================================
function escapeHtml(text) {
  if (!text) return '';
  return String(text)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

function updateStatusTime() {
  var el = document.getElementById('inboxStatus');
  if (!el || !activeEmail) return;
  var e = emails.find(function(x) { return x.name === activeEmail; });
  if (e && e.lastCheck) {
    el.textContent = 'Auto-refresh 5s · Terakhir: ' + new Date(e.lastCheck).toLocaleTimeString('id-ID');
  }
}

function copyEmail() {
  if (!activeEmail) return;
  var email = activeEmail + '@' + DOMAIN;

  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(email).then(function() {
      showToast('Email dicopy', 'success');
    }).catch(function() { fallbackCopy(email); });
  } else {
    fallbackCopy(email);
  }
}

function fallbackCopy(text) {
  try {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.top = '-9999px';
    document.body.appendChild(ta);
    ta.select();
    ta.setSelectionRange(0, 99999);
    var ok = document.execCommand('copy');
    document.body.removeChild(ta);
    if (ok) showToast('Email dicopy', 'success');
    else window.prompt('Copy manual:', text);
  } catch(err) {
    window.prompt('Copy manual:', text);
  }
}

// ==============================================================================
// HEALTH CHECK
// ==============================================================================
function checkHealth() {
  // Skip — gak butuh health check, cukup fetchInbox yang handle
  var el = document.getElementById('headerStatus');
  if (el) el.textContent = 'online';
}

// ==============================================================================
// INIT
// ==============================================================================
document.addEventListener('DOMContentLoaded', function() {
  var input = document.getElementById('emailInput');
  if (input) {
    input.addEventListener('keypress', function(e) {
      if (e.key === 'Enter') addEmail();
    });
  }
  loadFromStorage();
  renderEmailList();
  checkHealth();
  setInterval(checkHealth, 60000);
});
</script>
